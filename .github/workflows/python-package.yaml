# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Latest Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Dependancies
        run: |
          pip install -e .[test]
          pre-commit install
      - name: Run linting
        run: pre-commit run --all-files

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install -e .[test]
          pip install pycobertura

      - name: Run tests
        run: pytest --cov --cov-report=xml tests/

      - name: Report Coverage In Job Summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          coverage report -m --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Report coverage annotations
        run: pycobertura show coverage.xml --format github-annotation

  compatibility:
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', 'pypy3.10', 'pypy3.11']
        networkx-version: ['2.4','2.5', '2.6', '2.7', '2.8', '3.0', '3.1', '3.2', '3.3', '3.4']
        exclude:
           # missing wheels for scipy at these combos
          - python-version: 'pypy3.10'
            networkx-version: '2.6'
          - python-version: 'pypy3.11'
            networkx-version: '2.6'

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] networkx==${{ matrix.networkx-version }}
      - name: Test with Pytest
        run: |
          pytest tests
